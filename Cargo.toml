[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-nats = "0.51"
lapin = { version = "4.12", default-features = false, features = ["tokio"] }
rand = "0.10"
rand_chacha = "0.10"
argon2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
bevy = "0.20.1"
bevy_egui = "0.43.1"
