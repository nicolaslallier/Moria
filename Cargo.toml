[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = ["full"] }
async-nats = "0.51"
rand = "0.10"
rand_chacha = "0.10"
argon2 = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
