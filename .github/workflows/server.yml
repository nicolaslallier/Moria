name: server

# Builds the server-side images on GitHub (not on the infra host), pushes them to GHCR,
# then pins their tags in docker-compose.yml. Portainer's GitOps auto-update picks up
# that commit. Client-only and docs commits don't run this, so they never restart the server.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/moria-client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/moria-client/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

# One deploy at a time, in order; never cancel a pin halfway through.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      matrix:
        bin: [moria-server, moria-dwarf-ai, moria-worldgen]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Third-party actions pinned by SHA: they see GITHUB_TOKEN (packages: write).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: BIN=${{ matrix.bin }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/nicolaslallier/${{ matrix.bin }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,scope=${{ matrix.bin }},mode=max

  pin:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # A GITHUB_TOKEN push triggers no workflow, so this commit doesn't loop.
      - run: |
          sed -E -i "s#(ghcr\.io/nicolaslallier/moria-[a-z-]+):[A-Za-z0-9._-]+#\1:sha-${GITHUB_SHA}#" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: server images sha-${GITHUB_SHA::7}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
