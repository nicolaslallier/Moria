name: client

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/release/moria-client
            name: moria-client-linux
          - os: windows-latest
            bin: target/release/moria-client.exe
            name: moria-client-windows.exe
          # macos-latest runners are Apple Silicon: arm64 build.
          - os: macos-latest
            bin: target/release/moria-client
            name: moria-client-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bevy Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release -p moria-client
      - run: cargo test --workspace
      - name: Rename binary
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.bin }}" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/moria-client-linux
            dist/moria-client-windows.exe
            dist/moria-client-macos
          fail_on_unmatched_files: true
