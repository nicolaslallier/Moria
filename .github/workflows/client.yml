name: client

on:
  push:
    branches: [main]
    tags: ["*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bevy Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release -p moria-client
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: moria-client-${{ matrix.os }}
          path: |
            target/release/moria-client
            target/release/moria-client.exe
          if-no-files-found: error
