# Stack Moria. Variable de stack Portainer OBLIGATOIRE : MORIA_INVITE (code d'invitation).
#
# Déploiement : Portainer (stack 6) suit main en auto-update GitOps. Les images sont
# construites par .github/workflows/server.yml, poussées sur GHCR, puis épinglées
# ci-dessous par un commit automatique. Un commit sans changement d'image (client,
# docs) ne recrée donc aucun conteneur. Rollback : git revert du commit « deploy: ».
# En local, docker-compose.override.yml (chargé automatiquement) reconstruit depuis les sources.

services:
  nats:
    image: nats:2-alpine
    restart: unless-stopped

  # Génère le monde au premier démarrage (sans effet si /data/world.bin existe), puis s'arrête.
  worldgen:
    image: ghcr.io/nicolaslallier/moria-worldgen:sha-55fedb4a1603633d782875013252e051868a9a69
    volumes: ["moria-data:/data"]
    command: ["--out", "/data/world.bin"]
    restart: "no"

  server:
    image: ghcr.io/nicolaslallier/moria-server:sha-55fedb4a1603633d782875013252e051868a9a69
    # Sauvegarde finale de world.bin sur SIGTERM : marge au-delà des 10 s par défaut.
    stop_grace_period: 30s
    # 7777 n'est plus publié ici : le nginx de l'infra (stream.d/moria.conf) l'expose et
    # joint ce conteneur par l'alias « moria-server » sur infra-net.
    # 9464 : /metrics pour Prometheus (stack Infra, via host.docker.internal:9464).
    # Ne jamais le rediriger sur le routeur : seul 7777 sort sur Internet.
    ports: ["9464:9464"]
    networks:
      default:
      infra-net: { aliases: [moria-server] }
    volumes: ["moria-data:/data"]
    environment:
      NATS_URL: nats://nats:4222
      MORIA_INVITE: ${MORIA_INVITE:?définir MORIA_INVITE dans les variables de la stack Portainer}
      # Derrière nginx, toutes les connexions viennent de l'IP du proxy : la limite par IP
      # réelle est faite par nginx (limit_conn), on neutralise celle du serveur.
      MORIA_MAX_PER_IP: ${MORIA_MAX_PER_IP:-1000}
    restart: unless-stopped
    depends_on:
      nats: { condition: service_started }
      worldgen: { condition: service_completed_successfully }

  dwarf-ai:
    image: ghcr.io/nicolaslallier/moria-dwarf-ai:sha-55fedb4a1603633d782875013252e051868a9a69
    environment:
      NATS_URL: nats://nats:4222
    restart: unless-stopped
    depends_on: [nats]
    deploy:
      replicas: 1

networks:
  infra-net:
    external: true

volumes:
  moria-data:
    name: moria-data
